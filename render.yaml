# Render Blueprint: https://render.com/docs/blueprint-spec
# Native Node (no Docker) — avoids "Dockerfile: no such file" on some Render builds.
# Set in dashboard: FMP_API_KEY (quotes + stock profile), CLIENT_URL, SERVER_URL, SESSION_SECRET,
# Google OAuth, and build-time VITE_* (VITE_API_URL = your API HTTPS URL if the UI is on another host).
services:
  - type: web
    name: trueprice-api
    runtime: node
    # --include=dev: Vite lives in devDependencies; Render sets NODE_ENV=production and skips devDeps by default.
    buildCommand: npm install --include=dev && npm run build && cd server && npm install
    # Same as package.json "render:start" — build client into server/static then run API.
    startCommand: npm run render:start
    plan: starter
    envVars:
      - key: DB_PATH
        value: /var/data/trueprice.db
      - key: FMP_FINANCIALS_DIR
        value: /var/data/fmp-financials
      - key: SCREENER_DATA_DIR
        value: /var/data/screener
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
