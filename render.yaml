# Render Blueprint: https://render.com/docs/blueprint-spec
# Native Node (no Docker) — avoids "Dockerfile: no such file" on some Render builds.
# Set in dashboard: FMP_API_KEY (quotes + stock profile), CLIENT_URL, SERVER_URL, SESSION_SECRET,
# Google OAuth, and build-time VITE_* (VITE_API_URL = your API HTTPS URL if the UI is on another host).
#
# Fair-value email alerts (optional — the app runs fine without them):
#   RESEND_API_KEY      Resend API key. Requires a verified sending domain: add Resend's
#                       DKIM/SPF DNS records for trueprice.cash at GoDaddy first, or sends
#                       fail with only a warning in the logs.
#   EMAIL_FROM          e.g. "TruePrice <alerts@trueprice.cash>" — must be on that domain.
#   INTERNAL_TASK_TOKEN Long random shared secret for the two scheduler routes below.
#
# Daily jobs and the free-tier caveat: the fair-value sweep and the email digest both run on
# in-process timers, which only fire while the instance is awake. On a sleeping instance,
# drive them from one external scheduler (cron-job.org) with header x-internal-token:
#   POST /api/internal/run-sweep        recompute watchlist fair values, flag changes
#   POST /api/internal/dispatch-emails  email the changes the sweep found
# Schedule the sweep first and the digest 15–30 minutes later, so the day's changes exist
# before the email goes out. Both routes return 202 immediately and run in the background.
#
# TASI earnings commentary and the daily fair-value card use the same header:
#   POST /api/internal/publish-earnings   every 2 hours (publishes when FMP has a new period)
#   POST /api/internal/daily-gap-post     once a day
# Optional: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, X_USER_ACCESS_TOKEN.
# FMP often lags Tadawul, so a filing can appear later than two hours after the exchange posts it.
# WhatsApp groups are posted by hand using the image URL in the daily response.
services:
  - type: web
    name: trueprice-api
    runtime: node
    # --include=dev: Vite lives in devDependencies; Render sets NODE_ENV=production and skips devDeps by default.
    buildCommand: npm install --include=dev && npm run build && cd server && npm install
    # Same as package.json "render:start" — build client into server/static then run API.
    startCommand: npm run render:start
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_AGENT_ID
        sync: false
      - key: DB_PATH
        value: /var/data/trueprice.db
      - key: FMP_FINANCIALS_DIR
        value: /var/data/fmp-financials
      - key: SCREENER_DATA_DIR
        value: /var/data/screener
      - key: VITE_GA_MEASUREMENT_ID
        value: G-K34F3YG5TV
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
