<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Must load before the Vite bundle so window.__TP_PUBLIC_API_URL__ is set -->
    <script src="/runtime-config.js"></script>
    <!-- Before React: remove legacy ?auth=api_required (cached old JS used to add it; avoids banner flash) -->
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.get("auth") === "api_required") {
            u.searchParams.delete("auth");
            history.replaceState(history.state, "", u.pathname + u.search + u.hash);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <title>TruePrice.Cash – Fair Value &amp; Fundamentals (US, TASI, Tokyo)</title>
    <meta name="description" content="Analyze US, Saudi (TASI), and Tokyo stocks on TruePrice.Cash — fair value estimates, financial statements, fundamentals, and a stock screener." />
    <link rel="canonical" href="https://trueprice.cash/" />
    <meta property="og:title" content="TruePrice.Cash – Fair Value &amp; Fundamentals (US, TASI, Tokyo)" />
    <meta property="og:description" content="Analyze US, Saudi (TASI), and Tokyo stocks on TruePrice.Cash — fair value estimates, financial statements, fundamentals, and a stock screener." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trueprice.cash/" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <!-- Fonts: non-blocking load (display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

        rel="stylesheet"

      />
    </noscript>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://trueprice.cash/#website",
            "url": "https://trueprice.cash/",
            "name": "TruePrice.Cash",
            "description": "Stock fair value and fundamentals for US, TASI, and Tokyo markets.",
            "inLanguage": ["en", "ar"],
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://trueprice.cash/stock/{search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://trueprice.cash/#organization",
            "name": "TruePrice.Cash",
            "url": "https://trueprice.cash/"
          }
        ]
      }
    </script>
    <style>
